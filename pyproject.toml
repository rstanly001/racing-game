[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "racing"
version = "0.1.0"
description = "A 2D racing game with a physics engine, AI opponent, and telemetry analysis."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohit Stanly", email = "rohit.stanly@tu-dortmund.de" }]
keywords = ["game", "racing", "pygame", "physics", "telemetry"]

dependencies = [
    "pygame>=2.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/rstanly001/racing-game"

[tool.hatch.build.targets.wheel]
packages = ["src/racing"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
